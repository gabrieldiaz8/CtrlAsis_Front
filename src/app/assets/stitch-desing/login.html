<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitFlow Manager - Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "outline": "#75777c",

                      "primary-fixed": "#d9e3f6",

              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden">
<!-- Background Pattern -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, #191c1d 1px, transparent 0); background-size: 24px 24px;"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1024px] px-margin-mobile md:px-margin-desktop relative z-10 flex flex-col md:flex-row items-center justify-center gap-xl md:gap-2xl">
<!-- Left Side: Brand Identity (Hidden on small mobile, visible on larger screens) -->
<div class="hidden md:flex flex-col items-start justify-center flex-1 max-w-[400px]">
<div class="bg-primary text-on-primary w-16 h-16 rounded-xl flex items-center justify-center mb-lg shadow-[0_10px_15px_rgba(0,0,0,0.1)]">
<span class="material-symbols-outlined text-4xl" data-icon="fitness_center" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<h1 class="text-display-lg font-display-lg text-primary mb-md">FitFlow Manager</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Precisión y velocidad para el control total de tu centro deportivo.</p>
</div>
<!-- Right Side: Login Form -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_rgba(0,0,0,0.1)] border border-outline-variant p-lg md:p-xl flex-1 relative overflow-hidden">
<!-- Mobile Brand Header -->
<div class="md:hidden flex flex-col items-center mb-lg text-center">
<div class="bg-primary text-on-primary w-12 h-12 rounded-lg flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-2xl" data-icon="fitness_center" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary">FitFlow Manager</h1>
</div>
<div class="mb-xl">
<h2 class="text-headline-md font-headline-md text-primary mb-xs">Acceso al Sistema</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant">Ingresa tus credenciales de administrador.</p>
</div>
<form class="space-y-lg">
<!-- Email Field -->
<div>
<label class="block text-label-sm font-label-sm text-primary mb-xs" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm text-body-md font-body-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors shadow-[0_1px_3px_rgba(0,0,0,0.1)]" id="email" name="email" placeholder="admin@fitflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-label-sm font-label-sm text-primary mb-xs" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm text-body-md font-body-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors shadow-[0_1px_3px_rgba(0,0,0,0.1)]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant" for="remember-me">
                            Recordarme
                        </label>
</div>
<a class="text-label-sm font-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">
                        ¿Olvidé mi contraseña?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-sm px-md border border-transparent rounded-lg shadow-sm text-label-md font-label-md text-on-secondary bg-secondary hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all active:scale-[0.98]" type="submit">
                    Ingresar al Panel
                    <span class="material-symbols-outlined ml-2 text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Contextual Decorative Elements -->
<div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary-fixed rounded-tl-full opacity-20 pointer-events-none mix-blend-multiply blur-3xl"></div>
<div class="absolute top-0 left-0 w-48 h-48 bg-tertiary-fixed rounded-br-full opacity-20 pointer-events-none mix-blend-multiply blur-3xl"></div>
</body></html>

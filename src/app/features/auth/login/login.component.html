<div class="min-h-screen w-full flex items-center justify-center bg-background px-4">
  <!-- Background Pattern -->
  <div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, #191c1d 1px, transparent 0); background-size: 24px 24px;"></div>
  
  <!-- Decorative Elements -->
  <div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary-fixed rounded-tl-full opacity-20 pointer-events-none mix-blend-multiply blur-3xl"></div>
  <div class="absolute top-0 left-0 w-48 h-48 bg-tertiary-fixed rounded-br-full opacity-20 pointer-events-none mix-blend-multiply blur-3xl"></div>

  <!-- Main Content Canvas -->
  <main class="w-full max-w-[420px] relative z-10">
    <!-- Mobile Brand Header -->
    <div class="flex flex-col items-center mb-8 text-center">
      <div class="bg-primary text-on-primary w-12 h-12 rounded-lg flex items-center justify-center mb-4 shadow-sm">
        <lucide-icon [img]="Mail" class="w-6 h-6" style="transform: rotate(-45deg);"></lucide-icon>
      </div>
      <h1 class="text-headline-lg font-bold text-primary">FitFlow Manager</h1>
    </div>

    <div class="bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_rgba(0,0,0,0.1)] border border-outline-variant p-6 md:p-8">
      <div class="mb-8">
        <h2 class="text-headline-md font-bold text-primary mb-2">Acceso al Sistema</h2>
        <p class="text-body-sm text-on-surface-variant">Ingresa tus credenciales de administrador.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label class="block text-label-sm font-medium text-primary mb-1.5" for="email">Correo Electrónico</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-icon [img]="Mail" class="w-5 h-5 text-on-surface-variant"></lucide-icon>
            </div>
            <input 
              type="email" 
              id="email"
              formControlName="email"
              class="block w-full pl-10 pr-3 py-2.5 text-body-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors shadow-[0_1px_3px_rgba(0,0,0,0.1)] placeholder:text-on-surface-variant/50"
              placeholder="admin@fitflow.com"
              autocomplete="email"
              [class.border-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            />
          </div>
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" 
             class="text-label-sm text-error mt-1.5">Ingresa un correo electrónico válido</p>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-label-sm font-medium text-primary mb-1.5" for="password">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-icon [img]="Lock" class="w-5 h-5 text-on-surface-variant"></lucide-icon>
            </div>
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              id="password"
              formControlName="password"
              class="block w-full pl-10 pr-12 py-2.5 text-body-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors shadow-[0_1px_3px_rgba(0,0,0,0.1)] placeholder:text-on-surface-variant/50"
              placeholder="••••••••"
              autocomplete="current-password"
              [class.border-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
            <button 
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1"
              aria-label="Mostrar/ocultar contraseña">
              <lucide-icon [img]="showPassword() ? EyeOff : Eye" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
             class="text-label-sm text-error mt-1.5">La contraseña debe tener al menos 6 caracteres</p>
        </div>

        <!-- Error Message -->
        <div *ngIf="error()" class="p-3 bg-error-container text-on-error-container text-label-sm rounded-lg flex items-center gap-2" role="alert">
          <lucide-icon [img]="Loader2" class="w-4 h-4" style="transform: rotate(45deg);"></lucide-icon>
          {{ error() }}
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-2">
          <div class="flex items-center">
            <input 
              type="checkbox" 
              id="remember-me" 
              (change)="onRememberMeChange($event)"
              class="w-4 h-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-surface" />
            <label class="ml-2 block text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
              Recordarme
            </label>
          </div>
          <a class="text-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">
            ¿Olvidé mi contraseña?
          </a>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          [disabled]="loading() || loginForm.invalid"
          class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-label-md font-medium text-on-secondary bg-secondary hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
          <lucide-icon [img]="Loader2" class="w-5 h-5 animate-spin mr-2" *ngIf="loading()"></lucide-icon>
          <span *ngIf="!loading()">Ingresar al Panel</span>
          <span *ngIf="loading()">Iniciando sesión...</span>
          <lucide-icon [img]="ArrowRight" class="w-5 h-5 ml-2" *ngIf="!loading()"></lucide-icon>
        </button>
      </form>
    </div>
  </main>
</div>

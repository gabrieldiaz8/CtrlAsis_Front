<div class="flex flex-col h-full">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
    <div>
      <h1 class="text-headline-lg font-bold text-on-background">Configuración</h1>
      <p class="text-body-sm text-on-surface-variant mt-1">Gestioná tu negocio, sus catálogos y los negocios de la plataforma.</p>
    </div>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.1)] overflow-hidden flex-1">
    <div class="grid lg:grid-cols-[250px_1fr]">
      <!-- MOBILE: horizontal tab bar -->
      <nav class="lg:hidden flex items-center gap-1 overflow-x-auto px-4 pt-3 border-b border-outline-variant" aria-label="Secciones de configuración">
        @for (tab of tabs(); track tab.id) {
          <button (click)="onTabChange(tab.id)"
                  [class]="activeTab() === tab.id ? 'bg-secondary-container text-on-secondary-container' : 'text-on-surface-variant hover:bg-surface-container-high'"
                  class="flex items-center gap-2 px-4 py-2.5 rounded-lg text-label-md font-medium transition-colors whitespace-nowrap">
            <lucide-icon [img]="tab.icon" class="w-5 h-5"></lucide-icon>
            <span>{{ tab.label }}</span>
          </button>
        }
      </nav>

      <!-- DESKTOP: vertical sidebar (sticky) -->
      <aside class="hidden lg:flex lg:flex-col gap-1 p-4 border-r border-outline-variant bg-surface-container-low/60 lg:self-start lg:sticky lg:top-6 max-h-[calc(100vh-6rem)] overflow-y-auto" aria-label="Secciones de configuración">
        @for (tab of tabs(); track tab.id) {
          <button (click)="onTabChange(tab.id)"
                  [class]="activeTab() === tab.id ? 'bg-secondary text-on-secondary shadow-sm' : 'text-on-surface-variant hover:bg-surface-container-high'"
                  class="flex flex-col items-start gap-1 px-4 py-3 rounded-lg text-left transition-colors w-full">
            <span class="flex items-center gap-3 text-label-md font-medium">
              <lucide-icon [img]="tab.icon" class="w-5 h-5"></lucide-icon>
              {{ tab.label }}
            </span>
            <span class="text-body-sm pl-8" [class.text-on-secondary/70]="activeTab() === tab.id" [class.text-on-surface-variant/80]="activeTab() !== tab.id">
              {{ tab.description }}
            </span>
          </button>
        }
      </aside>

      <!-- Section content -->
      <div class="min-w-0" [@crossfade]="activeTab()">
        @switch (activeTab()) {
          @case ('membresias') {
            <app-seccion-membresias />
          }
          @case ('catalogos') {
            <app-seccion-catalogos />
          }
          @case ('clientes') {
            <app-seccion-clientes />
          }
          @case ('usuarios') {
            <app-seccion-usuarios />
          }
        }
      </div>
    </div>
  </div>
</div>

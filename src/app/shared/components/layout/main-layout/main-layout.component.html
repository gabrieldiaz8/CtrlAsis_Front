<div class="bg-background text-on-background font-body-md min-h-screen flex">
  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [userName]="userName()"
    [userRole]="userRole()"
  ></app-sidebar>

  <div class="flex-1 flex flex-col min-h-screen transition-all duration-300" [class.ml-64]="!sidebarCollapsed()" [class.ml-20]="sidebarCollapsed()">
    <app-navbar
      [sidebarCollapsed]="sidebarCollapsed()"
      [pageTitle]="pageTitle()"
      [userName]="userName()"
      [userRole]="userRole()"
      (toggleSidebar)="onToggleSidebar()"
      (logout)="onLogout()"
    ></app-navbar>

    <main id="main-content" tabindex="-1" aria-label="Contenido principal" class="flex-1 p-margin-desktop overflow-y-auto">
      <div class="relative w-full h-full" [@routeFade]="routeState(outlet)">
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </main>
  </div>
</div>

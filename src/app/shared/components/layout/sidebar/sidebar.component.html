<nav aria-label="Navegación principal" class="h-screen w-64 fixed left-0 top-0 bg-surface-variant border-r border-outline-variant shadow-sm flex flex-col py-6 px-4 z-50 transition-all duration-300" [class.w-20]="collapsed()">
  <!-- Brand -->
  <div class="mb-10 px-2 flex items-start justify-between">
    <div class="flex flex-col gap-1 overflow-hidden">
      <span class="text-headline-md font-display font-bold text-on-surface truncate">FitFlow Manager</span>
      <span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider truncate">Administración Central</span>
    </div>
    
    <button
      (click)="themeService.toggle()"
      class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-all cursor-pointer active:opacity-70 flex-shrink-0"
      [attr.aria-label]="themeService.mode() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      title="Cambiar tema"
    >
      @if (themeService.mode() === 'dark') {
        <lucide-icon [img]="Sun" class="w-4 h-4"></lucide-icon>
      } @else {
        <lucide-icon [img]="Moon" class="w-4 h-4"></lucide-icon>
      }
    </button>
  </div>

  <!-- Navigation Links -->
  <div class="flex flex-col gap-2 flex-grow overflow-y-auto">
    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-secondary-container text-secondary-fixed font-bold"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 cursor-pointer active:opacity-70 scale-95 transition-transform duration-150 group"
        [title]="collapsed() ? item.label : ''"
      >
        <lucide-icon [img]="item.icon" class="text-xl flex-shrink-0" size="24"></lucide-icon>
        @if (!collapsed()) {
          <span class="text-label-md font-label-md truncate">{{ item.label }}</span>
        }
      </a>
    }
  </div>

  <!-- CTA & Avatar Bottom -->
  <div class="mt-auto flex flex-col gap-6 border-t border-outline/30 pt-4">
    @if (!collapsed()) {
      <div class="flex items-center gap-3 px-2">
        <div class="w-10 h-10 rounded-full border border-outline-variant bg-secondary-container flex items-center justify-center flex-shrink-0">
          <lucide-icon [img]="User" class="w-5 h-5 text-secondary"></lucide-icon>
        </div>
        <div class="flex-1 min-w-0">
          <span class="text-label-sm font-label-sm text-on-surface truncate block">{{ userName() }}</span>
          <span class="text-label-sm font-label-sm text-on-surface-variant truncate block">{{ userRole() }}</span>
        </div>
      </div>
    } @else {
      <div class="flex items-center justify-center px-2">
        <div class="w-10 h-10 rounded-full border border-outline-variant bg-secondary-container flex items-center justify-center">
          <lucide-icon [img]="User" class="w-5 h-5 text-secondary"></lucide-icon>
        </div>
      </div>
    }

    @if (!collapsed()) {
      <button
        (click)="onLogout()"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors duration-200 cursor-pointer active:opacity-70"
      >
        <lucide-icon [img]="LogOut" class="text-xl flex-shrink-0"></lucide-icon>
        <span class="text-label-md font-label-md">Cerrar Sesión</span>
      </button>
    } @else {
      <button
        (click)="onLogout()"
        class="w-full flex items-center justify-center px-4 py-3 rounded-xl text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors duration-200 cursor-pointer active:opacity-70"
        title="Cerrar Sesión"
        aria-label="Cerrar Sesión"
      >
        <lucide-icon [img]="LogOut" class="text-xl"></lucide-icon>
      </button>
    }
  </div>
</nav>

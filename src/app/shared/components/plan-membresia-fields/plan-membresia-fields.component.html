<div [formGroup]="form()" class="space-y-5">
  <!-- Plan -->
  <div>
    <label class="block text-label-sm font-medium text-on-surface-variant mb-2">
      Plan de Membresía
    </label>
    <select formControlName="planId"
            aria-label="Plan de la membresía"
            class="w-full p-3 bg-surface border border-outline-variant rounded-lg text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all appearance-none disabled:opacity-50">
      <option value="">Seleccionar plan...</option>
      <option *ngFor="let plan of planes()" [value]="plan.id">
        {{ plan.tipoMembresiaNombre }} ({{ plan.diasPorSemana }} días/sem, {{ plan.duracionDias }} días)
      </option>
    </select>

    <p *ngIf="planRequerido" class="text-label-sm text-error mt-1">
      Seleccioná un plan para la membresía
    </p>
    <p *ngIf="planes().length === 0" class="text-body-sm text-on-surface-variant mt-2">
      No hay planes activos disponibles. Creá un plan desde la sección Planes.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <!-- Fecha de inicio -->
    <div>
      <label class="block text-label-sm font-medium text-on-surface-variant mb-2">
        Fecha de inicio
      </label>
      <div class="relative">
        <lucide-icon [img]="Calendar" class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant w-5 h-5"></lucide-icon>
        <input type="date" formControlName="fechaInicio"
               aria-label="Fecha de inicio de la membresía"
               class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all disabled:opacity-60" />
      </div>
    </div>

    <!-- Fecha de fin (calculada, solo lectura) -->
    <div>
      <label class="block text-label-sm font-medium text-on-surface-variant mb-2">
        Fecha de fin
      </label>
      <div class="relative">
        <lucide-icon [img]="Calendar" class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant w-5 h-5"></lucide-icon>
        <input type="date" formControlName="fechaFin"
               aria-label="Fecha de fin de la membresía (calculada)"
               aria-readonly="true" readonly tabindex="-1"
               class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-body-md text-on-surface-variant outline-none cursor-not-allowed" />
      </div>
      <p *ngIf="planSeleccionado() as plan" class="text-label-sm text-on-surface-variant mt-1">
        Calculada automáticamente: {{ plan.duracionDias }} días del plan
      </p>
    </div>
  </div>
</div>
